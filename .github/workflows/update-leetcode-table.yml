name: Update LeetCode Table

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run table generator
        run: python3 generate_leetcode_index.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: auto-update LeetCode problems table"
          git push